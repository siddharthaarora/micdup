name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Windows CPU build ──────────────────────────────────────────────────
  build-win-cpu:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S src/cpp -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DMICDUP_VULKAN=OFF
          -DMICDUP_CUDA=OFF
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create release zip
        shell: pwsh
        run: |
          $exe = "build/Release/MicDup.exe"
          if (Test-Path $exe) {
            Compress-Archive -Path $exe -DestinationPath "./MicDup-${{ github.ref_name }}-win-x64-cpu.zip"
          } else {
            Write-Error "MicDup.exe not found"
            exit 1
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./MicDup-${{ github.ref_name }}-win-x64-cpu.zip
          generate_release_notes: true

  # ── Windows Vulkan build ───────────────────────────────────────────────
  build-win-vulkan:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkPath = Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          echo "VULKAN_SDK=$($sdkPath.FullName)" >> $env:GITHUB_ENV
          echo "$($sdkPath.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: >
          cmake -S src/cpp -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DMICDUP_VULKAN=ON
          -DMICDUP_CUDA=OFF
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create release zip
        shell: pwsh
        run: |
          $exe = "build/Release/MicDup.exe"
          if (Test-Path $exe) {
            Compress-Archive -Path $exe -DestinationPath "./MicDup-${{ github.ref_name }}-win-x64-vulkan.zip"
          } else {
            Write-Error "MicDup.exe not found"
            exit 1
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./MicDup-${{ github.ref_name }}-win-x64-vulkan.zip

  # ── macOS Apple Silicon (arm64) build ──────────────────────────────────
  build-mac-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S src/cpp -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DMICDUP_METAL=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create release zip
        run: |
          APP_PATH="build/MicDup.app"
          if [ -d "$APP_PATH" ]; then
            cd build
            zip -r "../MicDup-${{ github.ref_name }}-mac-arm64.zip" MicDup.app
          else
            echo "MicDup.app not found"
            exit 1
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./MicDup-${{ github.ref_name }}-mac-arm64.zip

  # ── macOS Intel (x64) build ────────────────────────────────────────────
  build-mac-x64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S src/cpp -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DMICDUP_METAL=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create release zip
        run: |
          APP_PATH="build/MicDup.app"
          if [ -d "$APP_PATH" ]; then
            cd build
            zip -r "../MicDup-${{ github.ref_name }}-mac-x64.zip" MicDup.app
          else
            echo "MicDup.app not found"
            exit 1
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./MicDup-${{ github.ref_name }}-mac-x64.zip
